services:
  postgres:
    image: postgres:16
    container_name: cloudvault-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudvault
    ports:
      - "5434:5432"
    volumes:
      - cloudvault_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cloudvault-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: cloudvault-backend
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/cloudvault?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      FRONTEND_URL: "${FRONTEND_URL}"
      AWS_REGION: "${AWS_REGION}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_S3_BUCKET_NAME: "${AWS_S3_BUCKET_NAME}"
      PORT: 5001
    ports:
      - "5002:5001"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5002
    container_name: cloudvault-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  cloudvault_pgdata:
